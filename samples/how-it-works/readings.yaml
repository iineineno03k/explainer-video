# 読みの辞書: 表記: 読み (ひらがな か カタカナ)。字幕は表記のまま、声だけ読みで話す。
# 長い表記から先に置き換える。読み間違いに気づいたら、ここに足す。
VOICEVOX: ボイスボックス
YAML: ヤムル
HTML: エイチティーエムエル
Chrome: クローム
ffmpeg: エフエフエムペグ
mp4: エムピーフォー
Claude: クロード
explainer build: エクスプレイナー ビルド
台本: だいほん
赤枠: あかわく
# 「画 (え)」は単独だと「が」と読まれる。画像・画面・動画を先に読みで置き換えてから「画」を置き換える
画像: がぞう
画面: がめん
動画: どうが
画: え
